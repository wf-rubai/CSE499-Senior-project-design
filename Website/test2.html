<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pico Serial Test</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#1e1e1e;
        color:white;
        text-align:center;
        padding:40px;
    }

    button{
        padding:12px 25px;
        font-size:18px;
        cursor:pointer;
        margin-bottom:30px;
    }

    pre{
        text-align:left;
        display:inline-block;
        background:#2b2b2b;
        padding:20px;
        border-radius:10px;
        min-width:400px;
        min-height:150px;
        overflow:auto;
    }
</style>
</head>

<body>

<h2>Pi Pico Communication Test</h2>

<button onclick="sendCommand()">Toggle LED</button>

<h3>Latest Pico Output</h3>

<pre id="output">Waiting for data...</pre>

<script>

const SERVER = "http://127.0.0.1:5001";

//------------------------------------
// Read Pico Data Every Second
//------------------------------------
async function getData(){

    try{

        const response = await fetch(`${SERVER}/data`);
        const data = await response.json();

        document.getElementById("output").textContent =
            JSON.stringify(data, null, 4);

    }
    catch(err){
        console.log(err);
    }

}

setInterval(getData,1000);
getData();


//------------------------------------
// Button Press
//------------------------------------
async function sendCommand(){

    //--------------------------------
    // Future processing goes here
    //--------------------------------
    let command = {
        led: "toggle"
    };

    console.log("Sending:", command);

    try{

        const response = await fetch(`${SERVER}/send`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(command)
        });

        const result = await response.json();

        console.log("Server Reply:",result);

    }
    catch(err){
        console.log(err);
    }

}

</script>

</body>
</html>
